# Dave's tmux conf
#
# Dave Eddy <dave@daveeddy.com>
#

unbind C-b
set -g prefix C-a

bind C-c new-window
bind C-p previous-window
bind C-n next-window
bind C-d detach-client
bind C-a last-window
#bind C-b next-pane
bind a send-keys C-a

# Set status bar
set -g status-justify centre
set -g status-bg black
set -g status-fg white

set -g status-left-length 90
set -g status-left '#[bold,fg=blue][ #[default]#[fg=green]#H#[default] #[fg=yellow]::#[fg=magenta] {#[fg=green]#S#[fg=magenta]} #[bold,fg=blue]] ['

set -g status-right-length 70
set -g status-right '#[bold,fg=blue]] [ #[default,fg=green]#(date '+%m/%d') #[fg=yellow]#(date '+%H:%M') #[default,bold,fg=blue]]'

set-window-option -g window-status-current-format '#[fg=red](#[fg=cyan]#I#F#W#[fg=red]) '
set-window-option -g window-status-format '#[fg=green]#I#F#W '

# Automatically set window title
setw -g automatic-rename

# Set window notifications
#setw -g monitor-activity on
#set -g visual-activity on

# Set system bell to chime when anything changes
set-option -g bell-action any

# 256 color
set -g default-terminal "screen-256color"

# True 24-bit color for terminals that really support it, so theme hex renders
# exactly. Apple Terminal sets COLORTERM=truecolor but is NOT truecolor, so we
# do NOT add the Tc/RGB override for it; tmux downsamples hex to 256-color there
# (looks close). iTerm2, kitty, and most SSH targets get real RGB.
set -as terminal-features ",iterm2:RGB,xterm-kitty:RGB,tmux-256color:RGB,xterm-ghostty:RGB"

# iTerm2 reports TERM=xterm-256color (shared with the non-truecolor Apple
# Terminal, so we can't blanket-enable RGB for that TERM) but IS truecolor. It
# exports LC_TERMINAL=iTerm2 and forwards it over SSH (sshd accepts LC_*), so
# key RGB off that marker instead. Works locally AND on a remote host with no
# ssh config; never misfires on Apple Terminal (which doesn't set it). This is
# why the literal "iterm2:" entry above is effectively inert.
if-shell '[ "$LC_TERMINAL" = iTerm2 ]' 'set -as terminal-features ",xterm-256color:RGB"'

# ---------------------------------------------------------------------------
# Interaction / usability (mouse scroll, scrollback, copy, SSH responsiveness)
# ---------------------------------------------------------------------------

# Mouse: the wheel scrolls the pane's scrollback (enters copy-mode in a shell)
# and is forwarded natively to full-screen apps (vim, yazi, less). Drag-select
# goes through tmux copy-mode; hold Option (macOS) for a native terminal
# selection when you'd rather copy with the emulator.
set -g mouse on

# Keep a deep scrollback — long build output, logs and CLI agent transcripts
# blow past the 2000-line default fast.
set -g history-limit 50000

# vi keys in copy-mode (v to start selection, y to yank).
setw -g mode-keys vi

# Send yanked text to the SYSTEM clipboard via OSC52, so a copy made on a remote
# host lands in your local Mac clipboard over SSH. Needs a terminal
# that supports OSC52 (iTerm2 / kitty / ghostty; NOT Apple Terminal).
set -s set-clipboard on

# No ESC lag in vim over SSH; let vim autoread / yazi refresh on pane focus.
set -sg escape-time 10
set -g focus-events on

# Status/reload messages linger long enough to read (default is 750ms).
set -g display-time 2000

# Set the OUTER terminal's title to session:window#name — handy for knowing
# which case session you're attached to over SSH.
set -g set-titles on
set -g set-titles-string "#S:#I #W"

# vim muscle-memory in copy-mode: v starts a selection, y yanks it. With
# set-clipboard on (above) the yank travels to the system clipboard via OSC52.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Aidan's workflow additions (case/dev sessions + laptop<->ultrawide reflow)
# Scripts live in ~/Documents/dotfiles/tmux/ (this repo). run-shell passes the
# string to /bin/sh -c, so $HOME expands correctly.
# ---------------------------------------------------------------------------

# Show each pane's role (LLM/review/files, editor/ssh/fwd) on its top border.
# Prefer the @role user option (set by the launchers, survives shell title
# rewrites); fall back to the running command for panes without a role.
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}:#{?@role,#{@role},#{pane_current_command}} '

# Launch / attach the workflow sessions. The current pane's path is passed so
# the session is named after the project dir: case-work uses the dir basename
# (case-123 -> case-123, foo -> case-foo); dev prepends dev- (llm -> dev-llm).
# Launched from ~ or /, they stay plain "case"/"dev".
#   prefix + C  -> case-work session
#   prefix + V  -> dev-work session   (C-d / D is already detach-client)
bind C run-shell "$HOME/Documents/dotfiles/tmux/case.sh '#{pane_current_path}'"
bind V run-shell "$HOME/Documents/dotfiles/tmux/dev.sh '#{pane_current_path}'"

# Reflow the current session for the screen you're on.
#   prefix + w  -> ultrawide (3-pane, big main pane left)
#   prefix + e  -> laptop    (2-pane stack; extra panes parked in 'stash')
#   prefix + r  -> toggle between the two
#   prefix + t  -> auto-pick from the attached client width
bind w run-shell "$HOME/Documents/dotfiles/tmux/reflow.sh wide"
bind e run-shell "$HOME/Documents/dotfiles/tmux/reflow.sh narrow"
bind r run-shell "$HOME/Documents/dotfiles/tmux/reflow.sh toggle"
bind t run-shell "$HOME/Documents/dotfiles/tmux/reflow.sh auto"

# Manual pane resizing, vim-style. Uppercase so lowercase h/j/k/l stay free;
# -r makes them repeatable (after prefix, tap H H H without re-pressing C-a).
# C-a L overrides the default switch-client -l (jump to last client).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Theme picker: prefix + T (uppercase; distinct from lowercase t above) pops a
# menu of themes from tmux/themes/*.sh and applies the choice to this session.
bind T run-shell "$HOME/Documents/dotfiles/tmux/theme-menu.sh"

# ---------------------------------------------------------------------------
# Small conveniences
# ---------------------------------------------------------------------------

# prefix + R reloads this config (lowercase r is reflow-toggle, above).
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Ad-hoc splits that inherit the current pane's directory. The reflow/case/dev
# launchers own the structured layouts; these are for quick throwaway panes.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
